name: Jiuzhou
options:
  bundleIdPrefix: com.jiuzhou
  xcodeVersion: '15.4'
  projectFormat: xcode15_3
  deploymentTarget:
    iOS: '16.0'
settings:
  base:
    SWIFT_VERSION: '5.0'
    TARGETED_DEVICE_FAMILY: '1,2'
    IPHONEOS_DEPLOYMENT_TARGET: '16.0'
targets:
  Jiuzhou:
    type: application
    platform: iOS
    sources:
      - path: Jiuzhou
    resources:
      - path: Jiuzhou/AndroidArt
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: app.vanilla7419.emerald5335
        PRODUCT_NAME: Jiuzhou
        MARKETING_VERSION: '0.1.0'
        CURRENT_PROJECT_VERSION: 10
        CODE_SIGN_STYLE: Automatic
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
    info:
      path: Generated/Info.plist
      properties:
        CFBundleDisplayName: 九州书剑录
        CFBundleShortVersionString: $(MARKETING_VERSION)
        CFBundleVersion: $(CURRENT_PROJECT_VERSION)
        NSLocalNetworkUsageDescription: 连接同一网络中电脑上的九州书剑录游戏服务器。
        NSAppTransportSecurity:
          NSAllowsArbitraryLoadsInWebContent: true
        UILaunchScreen: {}
        UIAppFonts:
          - NotoSansCJK-Regular.ttc
        UISupportedInterfaceOrientations:
          - UIInterfaceOrientationPortrait
          - UIInterfaceOrientationLandscapeLeft
          - UIInterfaceOrientationLandscapeRight
          - UIInterfaceOrientationPortraitUpsideDown
        UIApplicationSupportsIndirectInputEvents: true
  JiuzhouUITests:
    type: bundle.ui-testing
    platform: iOS
    sources:
      - path: UITests
    dependencies:
      - target: Jiuzhou
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: app.vanilla7419.emerald5335.uitests
        GENERATE_INFOPLIST_FILE: YES
schemes:
  Jiuzhou:
    build:
      targets:
        Jiuzhou: all
    test:
      targets:
        - JiuzhouUITests
