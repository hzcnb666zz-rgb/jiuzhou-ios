name: Build and Sign Personal iOS Package
on:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  ios:
    runs-on: macos-14
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - name: Install project generator
        run: brew install xcodegen
      - name: Test and compile
        run: bash build-unsigned.sh
      - name: Sign and verify registered-device IPA
        env:
          IOS_P12_BASE64: ${{ secrets.IOS_P12_BASE64 }}
          IOS_P12_PASSWORD: ${{ secrets.IOS_P12_PASSWORD }}
          IOS_PROFILE_BASE64: ${{ secrets.IOS_PROFILE_BASE64 }}
        run: bash scripts/sign-ipa.sh
      - name: Upload signed IPA
        uses: actions/upload-artifact@v4
        with:
          name: Jiuzhou-signed-IPA
          path: build/Jiuzhou-signed.ipa
          if-no-files-found: error
          retention-days: 1
